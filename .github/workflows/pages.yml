# Torrek App-Hosting über GitHub Pages.
# Hintergrund: Supabase Edge Functions dürfen auf der Standard-Domain kein render-
# bares HTML ausliefern (Anti-Phishing, text/html → text/plain). GitHub Pages
# serviert hosting/ mit korrekten MIME-Types → PWA installierbar.
name: Pages deployen

on:
  push:
    branches: [claude/drytrack-docs-program-g64405]
    paths: ["hosting/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: enabled # aktiviert Pages beim ersten Lauf selbst
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hosting
      - id: deployment
        uses: actions/deploy-pages@v4
